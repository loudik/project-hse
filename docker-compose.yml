services:
  # Local-only database. Enabled by COMPOSE_PROFILES=local-db in .env.
  # On the server leave COMPOSE_PROFILES unset and point MYSQL_HOST to the real MySQL.
  mysql:
    profiles: ['local-db']
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  # Local-only object storage. Enabled by COMPOSE_PROFILES=local-storage in .env.
  # On the server leave it unset and point MINIO_ENDPOINT to the central storage.
  minio:
    profiles: ['local-storage']
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
    volumes:
      - minio_data:/data
    ports:
      - '127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001'
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      mysql:
        condition: service_healthy
        required: false # ignored when the mysql profile is not enabled
    volumes:
      - ./hse-backend-go/migrations:/migrations
    entrypoint: ['sh', '-c']
    command:
      - >
        sleep 3 &&
        for i in 1 2 3 4 5; do
          migrate -path=/migrations -database "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/${MYSQL_DATABASE}" up && exit 0;
          echo "migrate attempt $$i failed, retrying in 5s...";
          sleep 5;
        done;
        exit 1
    restart: 'no'

  backend:
    build: ./hse-backend-go
    restart: unless-stopped
    env_file:
      - ./hse-backend-go/.env
    environment:
      DB_DSN: '${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:3306)/${MYSQL_DATABASE}?parseTime=true'
      PORT: ${BACKEND_PORT:-3000}
      JWT_SECRET: ${JWT_SECRET}
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HSE Approval System}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_BUCKET: ${MINIO_BUCKET:-vessel-documents}
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
        required: false # ignored when the local-storage profile is not enabled
    ports:
      - '127.0.0.1:${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'

  frontend:
    build:
      context: ./hse-frontend-react
      args:
        VITE_MS_CLIENT_ID: ${MS_CLIENT_ID}
        VITE_MS_TENANT_ID: ${MS_TENANT_ID}
        VITE_MS_REDIRECT_URI: ${MS_REDIRECT_URI}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-80}:80'

volumes:
  mysql_data:
  minio_data: