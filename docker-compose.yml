services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306' # bound to localhost only - safe even on a public server
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s


  migrate:
    image: migrate/migrate:v4.17.1
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./hse-backend-go/migrations:/migrations
    entrypoint: ['sh', '-c']
    command:
      - >
        sleep 5 &&
        for i in 1 2 3 4 5; do
          migrate -path=/migrations -database "mysql://root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}" up && exit 0;
          echo "migrate attempt $$i failed, retrying in 5s...";
          sleep 5;
        done;
        exit 1
    restart: 'no'

  backend:
    build: ./hse-backend-go
    restart: unless-stopped
    env_file:
      - ./hse-backend-go/.env
    environment:
      DB_DSN: 'root:${MYSQL_ROOT_PASSWORD}@tcp(mysql:3306)/${MYSQL_DATABASE}?parseTime=true'
      PORT: ${BACKEND_PORT:-3000}
      # These override whatever is in hse-backend-go/.env, so the values
      # in the root .env are the single source of truth when running via
      # Docker. hse-backend-go/.env is still used for `go run main.go`
      # outside Docker.
      MS_CLIENT_ID: ${MS_CLIENT_ID}
      MS_TENANT_ID: ${MS_TENANT_ID}
      MS_CLIENT_SECRET: ${MS_CLIENT_SECRET}
      MS_REDIRECT_URI: ${MS_REDIRECT_URI}
      FRONTEND_URL: ${FRONTEND_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${BACKEND_PORT:-3000}:${BACKEND_PORT:-3000}'

  frontend:
    build:
      context: ./hse-frontend-react
      args:
        VITE_MS_CLIENT_ID: ${MS_CLIENT_ID}
        VITE_MS_TENANT_ID: ${MS_TENANT_ID}
        VITE_MS_REDIRECT_URI: ${MS_REDIRECT_URI}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-80}:80'

volumes:
  mysql_data:
